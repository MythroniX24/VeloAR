name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NDK_VERSION: 26.3.11579264
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Download stb_image.h
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/nothings/stb/master/stb_image.h \
            -o app/src/main/cpp/third_party/stb_image.h

      - name: Download Bullet3 sources
        run: |
          curl -fsSL \
            https://github.com/bulletphysics/bullet3/archive/refs/heads/master.zip \
            -o /tmp/bullet3.zip
          unzip -q /tmp/bullet3.zip -d /tmp/
          mkdir -p app/src/main/cpp/third_party/bullet3/src
          cp -r /tmp/bullet3-master/src/LinearMath \
                app/src/main/cpp/third_party/bullet3/src/
          cp -r /tmp/bullet3-master/src/BulletCollision \
                app/src/main/cpp/third_party/bullet3/src/
          cp -r /tmp/bullet3-master/src/BulletDynamics \
                app/src/main/cpp/third_party/bullet3/src/
          cp /tmp/bullet3-master/src/btBulletCollisionCommon.h \
             /tmp/bullet3-master/src/btBulletDynamicsCommon.h \
             app/src/main/cpp/third_party/bullet3/src/
          echo "Bullet3 downloaded:"
          find app/src/main/cpp/third_party/bullet3/src -name "*.cpp" | wc -l
          echo ".cpp files"

      - name: Extract ARCore .so
        run: |
          curl -fsSL \
            https://maven.google.com/com/google/ar/core/1.44.0/core-1.44.0.aar \
            -o /tmp/arcore.aar
          mkdir -p app/build/arcore-native
          unzip -o /tmp/arcore.aar "jni/*" -d app/build/arcore-native/
          find app/build/arcore-native -name "*.so"

      - name: Setup Gradle wrapper
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.7/bin/gradle wrapper \
            --gradle-version=8.7 \
            --distribution-type=bin \
            --project-dir=. \
            --no-daemon
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VeloAR-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
